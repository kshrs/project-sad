services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: sad2_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Backend Node.js / Express API Server
  backend:
    build: ./backend
    container_name: sad2_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/sad_db
      - CLIENT_URL=http://localhost:5100,http://127.0.0.1:5100,http://localhost:3000,http://localhost,*
      - JWT_SECRET=sad_jwt_super_secret_dev_key_2026_institutional
      - ALLOW_TEST_LOGIN=true
      - TIMEZONE=Asia/Kolkata
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backups:/home/kshrs/Projects/project_sad2/backups
    depends_on:
      - mongodb

  # Frontend Vite React Application
  frontend:
    build: ./frontend
    container_name: sad2_frontend
    restart: unless-stopped
    ports:
      - "80:5100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5100/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
