services:
  # db
  mongodb:
    image: mongo:latest
    container_name: sad_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # backend
  backend:
    build: ./backend
    container_name: sad_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/sad_db
    depends_on:
      - mongodb

  # frontend
  frontend:
    build: ./frontend
    container_name: sad_frontend
    ports:
      # "3000:80" production
      - "5100:5100"
    depends_on:
      - backend

volumes:
  mongo_data:
